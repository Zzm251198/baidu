<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>深圳轨道物流 AGV 仿真系统</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            // 地铁站务风：主色=深圳地铁绿，强调色=导视黄（调度/警示），底色维持深色控制台
            primary: '#00A862',
            secondary: '#2FD9A5',
            accent: '#F0A500',
            dark: '#0F172A',
            'dark-light': '#1E293B',
            'dark-lighter': '#334155',
          },
          fontFamily: {
            sans: ['Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', 'Arial', 'sans-serif'],
          },
          animation: {
            'pulse-slow': 'pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite',
          }
        },
      }
    }
  </script>
  <style>
    body {
      background-color: #0F172A;
      background-image:
        radial-gradient(circle at 10% 20%, rgba(0, 168, 98, 0.10) 0%, transparent 20%),
        radial-gradient(circle at 90% 80%, rgba(47, 217, 165, 0.08) 0%, transparent 20%);
      background-attachment: fixed;
    }
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #1E293B;
      border-radius: 3px;
    }
    ::-webkit-scrollbar-thumb {
      background: #334155;
      border-radius: 3px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #475569;
    }
  </style>
<link rel="stylesheet" href="/index.css">
</head>
<body class="font-sans text-gray-100 min-h-screen overflow-x-hidden">
  <div id="root"></div>
<script type="module" src="/index.tsx"></script>
</body>
</html>
