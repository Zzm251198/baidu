<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>深圳轨道物流 AGV 仿真系统</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            // 地铁站务风·白主题：主色=深圳地铁绿，强调色=导视黄，底色=白系。
            // dark 系 token 反转指向浅色 + gray 色阶整体反转——组件里的类名
            // （bg-dark / text-gray-100 等）一行不改，深浅关系即随色板翻转。
            primary: '#00A862',
            secondary: '#2FD9A5',
            accent: '#F0A500',
            dark: '#FFFFFF',
            'dark-light': '#F1F5F9',
            'dark-lighter': '#E2E8F0',
            gray: {
              50: '#030712', 100: '#111827', 200: '#1F2937', 300: '#374151',
              400: '#4B5563', 500: '#6B7280', 600: '#9CA3AF', 700: '#D1D5DB',
              800: '#E5E7EB', 900: '#F3F4F6',
            },
          },
          fontFamily: {
            sans: ['Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', 'Arial', 'sans-serif'],
          },
          animation: {
            'pulse-slow': 'pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite',
          }
        },
      }
    }
  </script>
  <style>
    body {
      background-color: #F8FAFC;
      background-image:
        radial-gradient(circle at 10% 20%, rgba(0, 168, 98, 0.06) 0%, transparent 20%),
        radial-gradient(circle at 90% 80%, rgba(47, 217, 165, 0.05) 0%, transparent 20%);
      background-attachment: fixed;
    }
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #F1F5F9;
      border-radius: 3px;
    }
    ::-webkit-scrollbar-thumb {
      background: #CBD5E1;
      border-radius: 3px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #94A3B8;
    }
  </style>
<link rel="stylesheet" href="/index.css">
</head>
<body class="font-sans text-gray-100 min-h-screen overflow-x-hidden">
  <div id="root"></div>
<script type="module" src="/index.tsx"></script>
</body>
</html>
