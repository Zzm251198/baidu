<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>深圳轨道物流 AGV 仿真系统</title>
  <!-- 内联 SVG favicon：消除 /favicon.ico 404 的 console 报错（页面健康探针的零报错目标） -->
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='46' fill='%2300A862'/%3E%3Ctext x='50' y='67' font-size='54' text-anchor='middle' fill='white' font-family='Arial,sans-serif' font-weight='bold'%3EM%3C/text%3E%3C/svg%3E">
  <!-- CDN 供应链加固：钉死精确版本（不再“永远最新”被静默投毒）。
       SRI 说明：jsdelivr 支持 CORS，font-awesome 带 SRI；tailwind Play CDN 不发
       Access-Control-Allow-Origin 头，SRI 的 CORS 前置条件不成立（加了必被拦），
       故只钉版本。彻底消除该依赖的办法是本地打包 tailwind 运行时（见汇报建议）。 -->
  <script src="https://cdn.tailwindcss.com/3.4.16"></script>
  <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet" integrity="sha384-wvfXpqpZZVQGK6TAh5PVlGOfQNHSoD2xbE+QkPxCAFlNEevoEH3Sl0sibVcOQVnN" crossorigin="anonymous">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            // 地铁站务风·白主题：主色=深圳地铁绿，强调色=导视黄，底色=白系。
            // dark 系 token 反转指向浅色 + gray 色阶整体反转——组件里的类名
            // （bg-dark / text-gray-100 等）一行不改，深浅关系即随色板翻转。
            primary: '#00A862',
            secondary: '#2FD9A5',
            accent: '#F0A500',
            dark: '#FFFFFF',
            'dark-light': '#F1F5F9',
            'dark-lighter': '#E2E8F0',
            gray: {
              50: '#030712', 100: '#111827', 200: '#1F2937', 300: '#374151',
              400: '#4B5563', 500: '#6B7280', 600: '#9CA3AF', 700: '#D1D5DB',
              800: '#E5E7EB', 900: '#F3F4F6',
            },
          },
          fontFamily: {
            sans: ['Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', 'Arial', 'sans-serif'],
          },
          animation: {
            'pulse-slow': 'pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite',
          }
        },
      }
    }
  </script>
  <style>
    body {
      background-color: #F8FAFC;
      background-image:
        radial-gradient(circle at 10% 20%, rgba(0, 168, 98, 0.06) 0%, transparent 20%),
        radial-gradient(circle at 90% 80%, rgba(47, 217, 165, 0.05) 0%, transparent 20%);
      background-attachment: fixed;
    }
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #F1F5F9;
      border-radius: 3px;
    }
    ::-webkit-scrollbar-thumb {
      background: #CBD5E1;
      border-radius: 3px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #94A3B8;
    }
  </style>
<link rel="stylesheet" href="/index.css">
</head>
<body class="font-sans text-gray-100 min-h-screen overflow-x-hidden">
  <div id="root"></div>
<script type="module" src="/index.tsx"></script>
</body>
</html>
